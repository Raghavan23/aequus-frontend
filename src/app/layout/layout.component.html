<div class="aequus-app-shell">
  <!-- Slim Rail Sidebar -->
  <aside class="sidebar-rail">
    <!-- Brand Logo -->
    <a routerLink="/home" class="brand-logo" title="Aequus Reconciliation Engine">
      <img src="images/logos/aequus-logo.png" alt="Aequus" class="brand-logo-img" />
    </a>

    <!-- Navigation Icon Links -->
    <nav class="rail-nav">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item" title="Command Center Overview">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>

      <a routerLink="/reconciliation" routerLinkActive="active" class="nav-item" title="Autonomous Reconciliation Workspace">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </a>

      <a routerLink="/clients" routerLinkActive="active" class="nav-item" title="Client Companies">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </a>

      <a routerLink="/invoices" routerLinkActive="active" class="nav-item" title="Invoices & Bills">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </a>
    </nav>

    <!-- Rail Footer / Logout -->
    <div class="rail-footer">
      <button type="button" class="nav-item logout-btn" (click)="logout()" title="Logout">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Container (Header + Content) -->
  <div class="main-wrapper">
    <!-- Top Header Bar -->
    <header class="app-header">
      <div class="header-left">
        <div class="header-firm-badge" *ngIf="user?.organizationName">
          <span class="firm-label">Firm</span>
          <span class="firm-name">{{ user?.organizationName }}</span>
        </div>
      </div>

      <div class="header-right">
        <!-- User Profile Dropdown Toggle -->
        <div class="user-profile-menu">
          <button type="button" class="user-pill-btn" (click)="toggleUserMenu()">
            <div class="avatar-circle">{{ initials }}</div>
            <span class="user-name-text">{{ userName }}</span>
            <span class="user-role-badge">{{ user?.role || 'ADMIN' }}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 10l5 5 5-5z" />
            </svg>
          </button>

          <!-- Dropdown Popover -->
          <div class="dropdown-popover" *ngIf="showUserMenu">
            <div class="popover-user-info">
              <strong>{{ userName }}</strong>
              <small>{{ userEmail }}</small>
              <div class="popover-org" *ngIf="user?.organizationName">
                🏢 {{ user?.organizationName }}
              </div>
            </div>
            <div class="popover-divider"></div>
            <a routerLink="/clients" class="popover-link" (click)="showUserMenu = false">Client Portfolios</a>
            <a routerLink="/reconciliation" class="popover-link" (click)="showUserMenu = false">Reconciliation Engine</a>
            <div class="popover-divider"></div>
            <button type="button" class="popover-link danger" (click)="logout()">Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Dynamic Router Outlet with View Transition Host -->
    <main class="content-body">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
